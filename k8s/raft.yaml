# ---------- Headless service: stable DNS names for peer-to-peer traffic ----------
apiVersion: v1
kind: Service
metadata:
  name: raft
  labels:
    app: raft
spec:
  clusterIP: None
  publishNotReadyAddresses: true   # peers must resolve each other while still starting up
  selector:
    app: raft
  ports:
    - name: http
      port: 8080
---
# ---------- Client service: one address, load-balanced over all ready pods ----------
apiVersion: v1
kind: Service
metadata:
  name: raft-client
spec:
  type: LoadBalancer               # Docker Desktop exposes this on localhost:8090
  selector:
    app: raft
  ports:
    - name: http
      port: 8090
      targetPort: 8080
---
# ---------- Per-pod services on localhost:8081-8085, so the test scripts work unchanged ----------
apiVersion: v1
kind: Service
metadata:
  name: raft-0-ext
spec:
  type: LoadBalancer
  selector:
    app: raft
    statefulset.kubernetes.io/pod-name: raft-0
  ports:
    - port: 8081
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: raft-1-ext
spec:
  type: LoadBalancer
  selector:
    app: raft
    statefulset.kubernetes.io/pod-name: raft-1
  ports:
    - port: 8082
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: raft-2-ext
spec:
  type: LoadBalancer
  selector:
    app: raft
    statefulset.kubernetes.io/pod-name: raft-2
  ports:
    - port: 8083
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: raft-3-ext
spec:
  type: LoadBalancer
  selector:
    app: raft
    statefulset.kubernetes.io/pod-name: raft-3
  ports:
    - port: 8084
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: raft-4-ext
spec:
  type: LoadBalancer
  selector:
    app: raft
    statefulset.kubernetes.io/pod-name: raft-4
  ports:
    - port: 8085
      targetPort: 8080
---
# ---------- The Raft cluster ----------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: raft
spec:
  serviceName: raft                # pods get DNS names raft-N.raft
  replicas: 5
  podManagementPolicy: Parallel    # start all 5 at once; Raft handles the ordering itself
  selector:
    matchLabels:
      app: raft
  template:
    metadata:
      labels:
        app: raft
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        fsGroup: 1001              # the data volume is writable by the non-root user
      containers:
        - name: raft
          image: raft-config-service:latest
          imagePullPolicy: Never   # use the image built locally by Docker Desktop
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RAFT_NODE_ID   # raft-0 ... raft-4, from the pod's own name
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RAFT_PEERS
              value: "raft-0@http://raft-0.raft:8080,raft-1@http://raft-1.raft:8080,raft-2@http://raft-2.raft:8080,raft-3@http://raft-3.raft:8080,raft-4@http://raft-4.raft:8080"
            - name: SERVER_PORT
              value: "8080"
          readinessProbe:          # client traffic only goes to pods that are up
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 300Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
  volumeClaimTemplates:            # one persistent volume per pod, kept across restarts
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Mi